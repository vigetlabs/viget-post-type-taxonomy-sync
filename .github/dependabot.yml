version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    ignore:
      # typescript-eslint doesn't support TS 7 yet, and typescript is only here
      # to satisfy it. Drop this when typescript-eslint#10940 lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
