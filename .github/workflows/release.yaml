name: Create Release

on:
  push:
    tags:
      - 'v*' # Create a release for any tag starting with 'v'.

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin assets
        run: npm run build

      - name: Build plugin ZIP
        run: npm run plugin-zip

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" --verify-tag \
            --title "$TAG: $(date '+%Y-%m-%d')" \
            --generate-notes \
            --latest \
            "viget-post-type-taxonomy-sync.zip#Viget Post Type Taxonomy Sync"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
